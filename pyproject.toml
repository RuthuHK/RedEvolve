[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "redevolve"
version = "0.1.0"
description = "Genetic-algorithm prompt-injection fuzzer for local LLMs, with a measured guardrail ablation."
requires-python = ">=3.12"
# Compatible-release ranges for installs; exact versions for reproduction are in requirements-lock.txt.
dependencies = [
    "httpx~=0.28",
    "python-dotenv~=1.2",
    "pyyaml~=6.0",
    "matplotlib~=3.11",
]

[project.optional-dependencies]
dev = [
    "pytest~=9.2",
    "ruff~=0.17",
]

[project.scripts]
redevolve = "redevolve.cli:main"

[tool.setuptools.packages.find]
include = ["redevolve*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "RUF",      # ruff-specific
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
